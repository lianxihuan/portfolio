<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account & Video Stills</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            background-color: #000000; /*黑色背景*/
            color: #ffffff; /*白色文字*/
        }
        /*顶部主页封面区域*/
        .cover-section {text-align:center; margin-bottom:40px;}
        .cover-section img {
            max-width:400px;
            border:8px solid white;
            box-shadow:0 2px 8px rgba(255,255,255,0.15);
        }
        /*自动横向滚动容器*/
        .scroll-wrap {
            overflow:hidden;
            width:100%;
        }
        .scroll-track {
            display:flex;
            gap:16px;
            animation: autoScroll 20s linear infinite;
        }
        .scroll-track img {
            width:220px;
            height:260px;
            object-fit:contain;
            border:8px solid white;
            box-shadow:0 2px 8px rgba(255,255,255,0.15);
            flex-shrink:0;
        }
        /*无缝循环滚动动画*/
        @keyframes autoScroll {
            0% {transform: translateX(0);}
            100% {transform: translateX(-100%);}
        }
        h2{text-align:center; margin:30px 0 15px;}
    </style>
</head>
<body>
    <h1>My Social Media Works</h1>

    <!-- 主页封面：cover.jpg -->
    <div class="cover-section">
        <h2>Account Homepage</h2>
        <img src="cover.jpg" alt="account cover">
    </div>

    <!-- 9张静帧自动横向无限滚动 shot-1.jpeg ~ shot-9.jpeg -->
    <h2>Video Stills</h2>
    <div class="scroll-wrap">
        <div class="scroll-track">
            <img src="shot-1.jpeg" alt="video still">
            <img src="shot-2.jpeg" alt="video still">
            <img src="shot-3.jpeg" alt="video still">
            <img src="shot-4.jpeg" alt="video still">
            <img src="shot-5.jpeg" alt="video still">
            <img src="shot-6.jpeg" alt="video still">
            <img src="shot-7.jpeg" alt="video still">
            <img src="shot-8.jpeg" alt="video still">
            <img src="shot-9.jpeg" alt="video still">
            <!--复制一遍，实现无缝循环-->
            <img src="shot-1.jpeg" alt="video still">
            <img src="shot-2.jpeg" alt="video still">
            <img src="shot-3.jpeg" alt="video still">
            <img src="shot-4.jpeg" alt="video still">
            <img src="shot-5.jpeg" alt="video still">
            <img src="shot-6.jpeg" alt="video still">
            <img src="shot-7.jpeg" alt="video still">
            <img src="shot-8.jpeg" alt="video still">
            <img src="shot-9.jpeg" alt="video still">
        </div>
    </div>

</body>
</html>
